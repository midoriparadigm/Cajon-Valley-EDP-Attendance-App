<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EDP Attendance</title>
  <meta name="description" content="EDP Attendance Tracking App" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Icons for UI elements -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDP Attendance">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#3b82f6">

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="landscape-overlay" class="landscape-overlay">
    <span class="material-icons-round">screen_rotation</span>
    <h2>Please Rotate Device</h2>
    <p>This attendance application is optimized for portrait orientation on mobile devices.</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
