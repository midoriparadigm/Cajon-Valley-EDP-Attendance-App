server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Content-Security-Policy ───────────────────────────────────────────────
    # Defined once as a variable so the server block and the static-asset
    # location block below cannot drift apart. (nginx `add_header` supports
    # variables in the header value.)
    #
    # connect-src covers, in order:
    #   'self'                          — same-origin API calls
    #   *.supabase.co (https + wss)     — hosted Supabase REST + realtime
    #   localhost / 127.0.0.1 (any port, http/https/ws/wss)
    #                                   — on-prem or self-hosted Supabase, local
    #                                     API gateways, and `vite preview` runs
    #   generativelanguage.googleapis.com — Gemini parent-report generation
    #   script.google.com / script.googleusercontent.com
    #                                   — Google Apps Script Drive audit webhook
    #                                     (VITE_GAS_WEBHOOK_URL); GAS issues a
    #                                     302 to *.googleusercontent.com, and CSP
    #                                     is re-checked on the redirect target.
    #
    # ON-PREM: if Supabase or the district API is served from a named internal
    # host rather than loopback, add that exact origin here, e.g.
    #   https://supabase.internal.cajonvalley.net
    # CSP has no CIDR support, so list hostnames explicitly rather than widening
    # this to a bare `http:` scheme source.
    set $csp "default-src 'self' https://*.supabase.co wss://*.supabase.co https://api.dicebear.com; img-src 'self' data: https://*.supabase.co https://api.dicebear.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://localhost:* https://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* https://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* https://generativelanguage.googleapis.com https://script.google.com https://script.googleusercontent.com;";

    # Security Headers
    # `always` ensures these are emitted on error responses (4xx/5xx) too, not
    # just 2xx/3xx.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;

        # nginx `add_header` does NOT merge across levels: because this block
        # declares its own add_header, every header from the server block would
        # otherwise be dropped for these responses. Re-declare them here.
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }
}
