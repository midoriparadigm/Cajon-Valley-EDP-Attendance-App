server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS — tell browsers to always use HTTPS for this origin (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Restrict browser feature access — only request camera/geolocation (needed for check-in)
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), midi=()" always;

    # Content Security Policy
    # Directives explained:
    #   default-src  — baseline fallback (supabase realtime + REST)
    #   script-src   — 'unsafe-inline' required by Vite SPA; limit to self + Gemini SDK
    #   style-src    — Google Fonts stylesheet
    #   font-src     — Google Fonts font files
    #   img-src      — data URIs for camera captures; DiceBear for demo avatars
    #   connect-src  — Supabase, Gemini API, and GAS webhook
    #   frame-src    — block all iframes
    #   object-src   — block Flash/plugins
    #   base-uri     — block base tag injection
    add_header Content-Security-Policy
        "default-src 'self' https://*.supabase.co wss://*.supabase.co; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob: https://*.supabase.co https://api.dicebear.com; \
         connect-src 'self' \
             https://*.supabase.co wss://*.supabase.co \
             https://generativelanguage.googleapis.com \
             https://script.google.com \
             https://script.googleusercontent.com; \
         frame-src 'none'; \
         object-src 'none'; \
         base-uri 'self';" always;

    # ── Compression ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── SPA routing ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching (security headers inherited from server block) ─────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers — nginx does not inherit add_header inside nested blocks
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
